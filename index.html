<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wine Fridge</title>
<meta name="theme-color" content="#151213">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://drive.google.com">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍷</text></svg>">
<style>
:root{
  --bg:#f5f1ec; --surface:#ffffff; --ink:#1e1a17; --muted:#6d655d; --line:#e3dbd1;
  --accent:#7b1e2e; --accent-ink:#ffffff; --soon:#e39a12; --shadow:0 14px 34px rgba(40,25,10,.16);
  --frame:#171413; --lit-1:#fffdf9; --lit-2:#f1ebe2; --lit-3:#e2d8cb; --wood-1:#b88d64; --wood-2:#8b6644;
  --red:#7d1d30; --white:#e3d48c; --rose:#e99aa1; --sparkling:#cfa63c; --orange:#d9893b; --dessert:#9a5a1c;
  --spirit:#6f8a99; --liqueur:#8b3f78; --other:#8c8c8c;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110e0f; --surface:#1c1819; --ink:#f2ede7; --muted:#a59c92; --line:#2f2a29;
    --accent:#d9677a; --accent-ink:#1a0a0d; --shadow:0 14px 40px rgba(0,0,0,.6); --frame:#060505;
  }
}
:root[data-theme="dark"]{
  --bg:#110e0f; --surface:#1c1819; --ink:#f2ede7; --muted:#a59c92; --line:#2f2a29;
  --accent:#d9677a; --accent-ink:#1a0a0d; --shadow:0 14px 40px rgba(0,0,0,.6); --frame:#060505;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:600px;margin:0 auto}
button{font:inherit;color:inherit}
a{color:var(--accent)}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 14px}
h1{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.1;margin:0}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin:0 0 12px}

/* Filter chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip .d{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip b{font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chip.soon .d{background:var(--soon)}

/* Fridge */
.cabinet{background:var(--frame);border-radius:24px;padding:10px;box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.07)}
.interior{position:relative;overflow:hidden;border-radius:15px;padding:14px 10px 6px;
  background:radial-gradient(120% 70% at 50% 0%,var(--lit-1) 0%,var(--lit-2) 55%,var(--lit-3) 100%)}
.interior::before{content:"";position:absolute;left:12%;right:12%;top:0;height:3px;border-radius:0 0 4px 4px;
  background:#fffaf0;box-shadow:0 0 22px 6px rgba(255,246,225,.95)}
.interior::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,.35) 0 14%,transparent 30% 100%)}
.shelf{position:relative;margin-bottom:6px}
.row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;padding:0 4px}
.bays{align-items:end;grid-template-rows:var(--h)}
.bay{height:var(--h);min-width:0;overflow:visible;display:flex;align-items:flex-end;justify-content:center;position:relative;border:0;background:none;padding:0;cursor:pointer;
  transition:opacity .2s,filter .2s,transform .15s}
.bay:active{transform:translateY(1px) scale(.98)}
.bay::after{content:"";position:absolute;bottom:-2px;left:22%;right:22%;height:8px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(60,40,20,.28),transparent);z-index:0}
.bay img,.bay svg{position:relative;z-index:1;max-width:100%;max-height:100%;object-fit:contain;display:block}
.bay img{mix-blend-mode:multiply}
.bay svg{height:calc(var(--h) * .92);width:auto;max-width:100%}
.bay.empty{cursor:default}
.bay.empty::before{content:"";width:46%;height:70%;border:1.5px dashed rgba(90,70,50,.18);border-radius:40% 40% 8px 8px / 18% 18% 8px 8px}
.bay.empty::after{display:none}
.board{height:11px;margin:0 -10px;background:linear-gradient(var(--wood-1),var(--wood-2));
  box-shadow:0 5px 8px -2px rgba(60,35,15,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.tags{padding-top:5px;padding-bottom:12px;align-items:start}
.tag{border:0;cursor:pointer;background:#fffef9;border-radius:3px;padding:3px 4px 4px;min-width:0;text-align:center;
  box-shadow:0 1px 2px rgba(60,40,20,.25);font-size:10.5px;line-height:1.2;color:#2a231d;transition:opacity .2s}
.tag b{display:block;font-weight:700;font-size:11px}
.tag span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#6d655d}
.tag.soon{background:#fff3d6;box-shadow:0 1px 2px rgba(60,40,20,.25),inset 0 2px 0 var(--soon)}
.tag.blank{visibility:hidden}
.shelf-n{position:absolute;left:-2px;bottom:16px;font-size:9px;font-weight:700;color:rgba(80,60,40,.35);z-index:2}
.dim{opacity:.16;filter:grayscale(1)}

/* Cans (bottom of fridge) */
.floor{border-top:2px solid rgba(90,70,50,.12);margin:2px -10px 0;padding:14px 10px 8px;
  background:linear-gradient(rgba(70,50,30,.04),rgba(70,50,30,.10))}
.floor-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(80,60,40,.45);margin:0 4px 8px}
.cans{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:12px 8px}
.can-item{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;transition:opacity .2s,filter .2s}
.can-pic{height:84px;width:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.can-pic img{max-height:100%;max-width:100%;object-fit:contain;mix-blend-mode:multiply}
.can-pic svg{height:78%;width:auto}
.qty{position:absolute;top:0;right:4px;background:var(--frame);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px;z-index:2}
.can-name{font-size:11px;color:#3e352d;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* List */
.group h3{font-family:var(--serif);font-weight:600;font-size:18px;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.group h3 .d{width:11px;height:11px;border-radius:50%;background:var(--c)}
.group h3 small{font-family:system-ui,sans-serif;font-size:13px;color:var(--muted);font-weight:400}
.items{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.items li+li{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:8px 14px 8px 8px;cursor:pointer}
.thumb{flex:none;width:44px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 50% 30%,var(--lit-1),var(--lit-3))}
.thumb img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.thumb svg{height:88%;width:auto}
.item .txt{flex:1;min-width:0}
.item .t1{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t2{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .loc{flex:none;font-size:12px;color:var(--muted);text-align:right}
.item .loc.soon{color:var(--soon);font-weight:600}
.empty-msg{color:var(--muted);text-align:center;padding:30px 0}

footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;font-size:13px;color:var(--muted)}
.link{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* Detail sheet */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:600px;max-height:92vh;background:var(--surface);color:var(--ink);
  border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,6,6,.55)}
dialog[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px)}to{transform:none}}
@media (min-width:640px){dialog{margin:auto;border-radius:22px}}
.hero{height:280px;display:flex;align-items:flex-end;justify-content:center;padding:26px 20px 18px;position:relative;
  background:radial-gradient(110% 80% at 50% 10%,var(--lit-1),var(--lit-2) 60%,var(--lit-3))}
.hero img{max-height:100%;max-width:70%;object-fit:contain;mix-blend-mode:multiply}
.hero svg{height:92%;width:auto}
.hero::after{content:"";position:absolute;bottom:14px;left:35%;right:35%;height:10px;border-radius:50%;background:radial-gradient(closest-side,rgba(60,40,20,.25),transparent)}
.sheet{padding:16px 20px max(22px,env(safe-area-inset-bottom))}
.sh-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.badge.soon,.badge.past{background:color-mix(in srgb,var(--soon) 20%,transparent);color:color-mix(in srgb,var(--soon) 65%,var(--ink))}
.badge.ready{background:color-mix(in srgb,#3c9a5f 18%,transparent);color:color-mix(in srgb,#3c9a5f 75%,var(--ink))}
.sheet h2{font-family:var(--serif);font-size:26px;line-height:1.15;margin:12px 0 2px;font-weight:600}
.producer{margin:0;color:var(--muted)}
.tasting{font-family:var(--serif);font-size:17px;line-height:1.5;margin:14px 0 0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin:16px 0 4px}
.facts div{min-width:0}
.facts .wide{grid-column:1/-1}
.facts dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.facts .private dt::after{content:" · only you";text-transform:none;letter-spacing:0}
.notes{margin:14px 0 0;padding:12px 14px;background:var(--bg);border-radius:12px}
.notes small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.fine{font-size:12px;color:var(--muted);margin:12px 0 0}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;display:inline-flex;justify-content:center;align-items:center;gap:6px;padding:12px 16px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.confirm{background:var(--soon);border-color:var(--soon);color:#1a1200}
.btn[disabled]{opacity:.6}
.close{position:absolute;right:12px;top:12px;border:0;background:rgba(255,255,255,.8);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;color:#5a5048;z-index:2}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;transition:.25s;z-index:10;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">Wine Fridge</h1>
      <p class="sub" id="summary">Loading…</p>
    </div>
    <div class="seg" role="group" aria-label="View">
      <button data-view="fridge" aria-pressed="true">Fridge</button>
      <button data-view="list" aria-pressed="false">List</button>
    </div>
  </header>

  <p class="note" id="demoNote" hidden>Showing sample bottles. Add your Apps Script URL to <code>API_URL</code> to go live. Demo owner PIN: 1234.</p>

  <nav class="chips" id="chips" aria-label="Filter"></nav>

  <main>
    <section id="fridgeView"><div class="cabinet"><div class="interior" id="interior"></div></div></section>
    <section id="listView" hidden></section>
  </main>

  <footer>
    <span><span id="updated"></span> · <button class="link" id="refresh">Refresh</button></span>
    <button class="link" id="ownerBtn">Owner</button>
  </footer>
</div>

<dialog id="sheet" aria-labelledby="sheetTitle"><div id="sheetBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Config ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbzsGdN76CpqTRXunofU5rnXN1Wubmop6a_jLO4yqJxWI0eIrzZVTlkt_6eN7GFFCJkmog/exec';
const DEMO_PIN = '1234';       // only used while API_URL is empty
const CURRENCY = 'GBP';

/* ===== Sample data (used only while API_URL is empty) ===== */
const SAMPLE = {
  title:'Wine Fridge', shelves:[4,3,4,4], owner:false,
  bottles:[
    {id:'b1',shelf:1,slot:1,type:'White',producer:'Simonnet-Febvre',name:'Chablis Premier Cru',vintage:2023,region:'Burgundy',country:'France',grape:'Chardonnay',abv:13,size:'75cl',drink_from:2025,drink_to:2031,tasting_notes:'Taut and mineral, with green apple, lemon and an oyster-shell finish.',pairing:'Oysters, grilled fish, goat’s cheese'},
    {id:'b2',shelf:1,slot:2,type:'Liqueur',producer:'The Marksologist',name:'Sloegroni',region:'',country:'England',abv:20,size:'50cl'},
    {id:'b3',shelf:1,slot:3,type:'Liqueur',producer:'Pallini',name:'Limoncello',country:'Italy',abv:26,size:'50cl',pairing:'Ice-cold, straight from the fridge'},
    {id:'b4',shelf:2,slot:1,type:'Red',producer:'Rutini',name:'Malbec',vintage:2020,region:'Mendoza',country:'Argentina',grape:'Malbec',abv:14,size:'75cl',drink_from:2022,drink_to:2026},
    {id:'b5',shelf:3,slot:1,type:'Red',producer:'Cà dei Frati',name:'Ronchedone',vintage:2020,region:'Lombardy',country:'Italy',grape:'Marzemino, Sangiovese, Cabernet Sauvignon',abv:13.5,size:'75cl',drink_from:2023,drink_to:2030},
    {id:'b6',shelf:3,slot:2,type:'Liqueur',producer:'Briottet',name:'Crème de Cassis de Dijon',country:'France',abv:20,size:'70cl',pairing:'Top with white wine for a Kir'},
    {id:'b7',shelf:3,slot:3,type:'Spirit',producer:'Sperone',name:'Extra Dry Vermouth',country:'Italy',abv:18,size:'1L'},
    {id:'b8',shelf:3,slot:4,type:'Dessert',producer:'Pellegrino',name:'Marsala Superiore',country:'Italy',abv:18,size:'75cl'},
    {id:'b9',shelf:4,slot:2,type:'Liqueur',producer:'Aperol',name:'Aperitivo',country:'Italy',abv:11,size:'70cl',pairing:'3 prosecco, 2 Aperol, 1 soda'}
  ],
  cans:[
    {id:'c1',name:'San Miguel',brewer:'Mahou San Miguel',style:'Lager',abv:5,qty:1,colour:'#c8102e'},
    {id:'c2',name:'Stella Artois',style:'Lager',abv:4.6,qty:1,colour:'#b8122f'},
    {id:'c3',name:'Desperados',style:'Flavoured lager',abv:5.9,qty:1,colour:'#2d6b3c'},
    {id:'c4',name:'La Chouffe',brewer:'Brasserie d’Achouffe',style:'Belgian blond',abv:8,qty:1,colour:'#d8282f'},
    {id:'c5',name:'Block Party',brewer:'Sambrooks',style:'Pale ale',qty:1,colour:'#f2b632'},
    {id:'c6',name:'Heineken',brewer:'Heineken',style:'Lager',abv:5,qty:2,colour:'#1f7a3c'},
    {id:'c7',name:'Pimm’s',style:'Premixed cocktail',qty:1,colour:'#7a1f2b'}
  ]
};

/* ===== Types ===== */
const TYPES = {
  sparkling:{label:'Sparkling',c:'var(--sparkling)'},
  white:{label:'White',c:'var(--white)'},
  rose:{label:'Rosé',c:'var(--rose)'},
  orange:{label:'Orange',c:'var(--orange)'},
  red:{label:'Red',c:'var(--red)'},
  dessert:{label:'Dessert & fortified',c:'var(--dessert)'},
  spirit:{label:'Spirits',c:'var(--spirit)'},
  liqueur:{label:'Liqueurs',c:'var(--liqueur)'},
  other:{label:'Other',c:'var(--other)'}
};
const ORDER = ['sparkling','white','rose','orange','red','dessert','spirit','liqueur','other'];
const typeKey = t => {
  t = String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
  if (TYPES[t]) return t;
  if (/^(spark|champ|fizz|cava|prosecco|cremant)/.test(t)) return 'sparkling';
  if (t.startsWith('ros')) return 'rose';
  if (/^(dessert|sweet|fort|port|sherry|sauternes|marsala|madeira)/.test(t)) return 'dessert';
  if (/^(liq|liku|creme|cream)/.test(t)) return 'liqueur';
  if (/^(spirit|gin|vodka|rum|whisk|tequila|mezcal|brandy|cognac|vermouth|aperitif|amaro|bitter)/.test(t)) return 'spirit';
  return 'other';
};

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\/\S+$/i.test(String(u||'').trim()) ? String(u).trim() : '';
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
const CACHE_KEY = 'wineFridge:data', PIN_KEY = 'wineFridge:pin';
const isDemo = !API_URL;

/** Ask Google Drive for a smaller thumbnail where the shelf doesn't need a big one. */
function imgSrc(u, w){
  const s = safeUrl(u);
  if (!s) return '';
  return /drive\.google\.com\/thumbnail/.test(s) ? s.replace(/([?&]sz=)w\d+/, '$1w' + w).replace(/^(?!.*[?&]sz=)(.*)$/, '$1&sz=w' + w) : s;
}
function shortVintage(v){
  const s = String(v ?? '').trim();
  if (/^\d{4}$/.test(s)) return '’' + s.slice(2);
  if (/^nv$/i.test(s)) return 'NV';
  return '';
}
function status(b){
  const y = new Date().getFullYear(), f = parseInt(b.drink_from), t = parseInt(b.drink_to);
  if (t && y > t) return {k:'past', label:'Past its best', soon:true};
  if (t && t - y <= 1) return {k:'soon', label: t === y ? 'Drink this year' : 'Drink by ' + t, soon:true};
  if (f && y < f) return {k:'young', label:'Wait until ' + f};
  if (f || t) return {k:'ready', label:'Ready to drink'};
  return null;
}
const sameName = b => String(b.name||'').trim().toLowerCase() === String(b.producer||'').trim().toLowerCase();
const bottleTitle = b => b.name && !sameName(b) ? `${b.producer ? b.producer + ' ' : ''}${b.name}` : (b.producer || b.name || 'Unnamed');
const fmtPct = v => { let n = Number(v); if (!isFinite(n)) return esc(v); if (n > 0 && n < 1) n *= 100; return (Math.round(n*10)/10) + '%'; };
const fmtMoney = v => { const n = Number(v); return isFinite(n) ? new Intl.NumberFormat(undefined,{style:'currency',currency:CURRENCY}).format(n) : esc(v); };
const stars = r => { const n = Math.max(0, Math.min(5, Math.round(Number(r)))); return n ? '★'.repeat(n) + '<span style="opacity:.25">' + '★'.repeat(5-n) + '</span>' : ''; };
const hex = c => /^#[0-9a-f]{3,8}$/i.test(String(c||'').trim()) ? String(c).trim() : '#8a8f94';

/* ===== Drawn fallbacks (used until a photo is found, or if one fails to load) ===== */
function bottleSvg(b){
  const k = typeKey(b.type), c = TYPES[k].c, v = esc(shortVintage(b.vintage));
  const squat = k === 'spirit' || k === 'liqueur';
  const body = squat
    ? 'M23 40h14v18c0 6 15 8 15 22v114a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6V80c0-14 15-16 15-22z'
    : 'M24 0h12v52c0 10 15 18 15 34v108a6 6 0 0 1-6 6H15a6 6 0 0 1-6-6V86c0-16 15-24 15-34z';
  const cap = squat ? '<rect x="21" y="30" width="18" height="16" rx="2" fill="#2b2522"/>' : '<rect x="23.5" y="0" width="13" height="32" rx="1.5" fill="rgba(0,0,0,.45)"/>';
  return `<svg viewBox="0 0 60 200" aria-hidden="true"><path d="${body}" fill="${c}"/><path d="${body}" fill="url(#gl)"/>${cap}
    <rect x="${squat?14:15}" y="118" width="${squat?32:30}" height="46" rx="2" fill="#f8f3e9"/>
    <text x="30" y="146" text-anchor="middle" font-size="11" font-weight="700" fill="#4a3f36" font-family="system-ui">${v}</text></svg>`;
}
function canSvg(c){
  const col = hex(c.colour);
  return `<svg viewBox="0 0 50 90" aria-hidden="true"><rect x="5" y="6" width="40" height="80" rx="7" fill="${col}"/><rect x="5" y="6" width="40" height="80" rx="7" fill="url(#gl)"/>
    <ellipse cx="25" cy="8" rx="18" ry="4" fill="#cfd4d8"/><ellipse cx="25" cy="8" rx="13" ry="2.6" fill="#aab0b5"/></svg>`;
}
function pic(o, kind, w, eager){
  const src = imgSrc(o.image, w);
  const fb = kind === 'can' ? canSvg(o) : bottleSvg(o);
  if (!src) return fb;
  return `<img src="${esc(src)}" alt="" ${eager ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" data-fb="${esc(kind)}:${esc(o.id)}" onerror="imgFail(this)">`;
}
window.imgFail = img => {
  const [kind, id] = (img.dataset.fb || '').split(':');
  const o = (kind === 'can' ? data.cans : data.bottles).find(x => String(x.id) === id);
  if (o) img.outerHTML = kind === 'can' ? canSvg(o) : bottleSvg(o);
};

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ===== State ===== */
let data = null, filter = 'all', view = 'fridge', owner = false, updatedAt = null;
const pin = () => store.get(PIN_KEY);
const visibleCans = () => (data.cans || []).filter(c => Number(c.qty ?? 1) > 0);
const matches = b => filter === 'all' || (filter === 'soon' ? !!status(b)?.soon : typeKey(b.type) === filter);

/* ===== Render ===== */
function render(){
  if (!data) return;
  $('#title').textContent = data.title || 'Wine Fridge';
  document.title = data.title || 'Wine Fridge';
  const nb = data.bottles.length, nc = visibleCans().reduce((a,c) => a + (Number(c.qty) || 1), 0);
  $('#summary').textContent = [`${nb} bottle${nb === 1 ? '' : 's'}`, nc ? `${nc} can${nc === 1 ? '' : 's'}` : ''].filter(Boolean).join(' · ');
  $('#ownerBtn').textContent = owner ? 'Owner ✓' : 'Owner';
  renderChips(); renderFridge(); renderList(); renderUpdated();
}

function renderChips(){
  const counts = {}; let soon = 0;
  data.bottles.forEach(b => { const k = typeKey(b.type); counts[k] = (counts[k]||0) + 1; if (status(b)?.soon) soon++; });
  if (filter !== 'all' && filter !== 'soon' && !counts[filter]) filter = 'all';
  if (filter === 'soon' && !soon) filter = 'all';
  let h = `<button class="chip" data-f="all" aria-pressed="${filter==='all'}">All <b>${data.bottles.length}</b></button>`;
  if (soon) h += `<button class="chip soon" data-f="soon" aria-pressed="${filter==='soon'}"><span class="d"></span>Drink soon <b>${soon}</b></button>`;
  ORDER.forEach(k => { if (counts[k]) h += `<button class="chip" data-f="${k}" aria-pressed="${filter===k}" style="--c:${TYPES[k].c}"><span class="d"></span>${TYPES[k].label} <b>${counts[k]}</b></button>`; });
  $('#chips').innerHTML = h;
}

function shelfHtml(label, n, cells, eager){
  const h = Math.round(Math.min(190, Math.max(105, 640 / n)));
  let bays = '', tags = '';
  cells.forEach(b => {
    if (!b) { bays += '<span class="bay empty"></span>'; tags += '<span class="tag blank"></span>'; return; }
    const st = status(b), dim = matches(b) ? '' : ' dim';
    const aria = `${bottleTitle(b)} ${b.vintage ?? ''}${st ? ', ' + st.label : ''}`;
    bays += `<button class="bay${dim}" data-kind="bottle" data-id="${esc(b.id)}" aria-label="${esc(aria)}">${pic(b, 'bottle', 400, eager)}</button>`;
    const vin = shortVintage(b.vintage);
    tags += `<button class="tag${st?.soon ? ' soon' : ''}${dim}" data-kind="bottle" data-id="${esc(b.id)}" tabindex="-1" aria-hidden="true">
      <b>${esc(vin || {dessert:'Dessert',spirit:'Spirit',liqueur:'Liqueur'}[typeKey(b.type)] || TYPES[typeKey(b.type)].label)}</b><span>${esc(b.name && !sameName(b) ? b.name : b.producer)}</span></button>`;
  });
  return `<div class="shelf"><span class="shelf-n">${esc(label)}</span>
    <div class="row bays" style="--n:${n};--h:${h}px">${bays}</div><div class="board"></div>
    <div class="row tags" style="--n:${n}">${tags}</div></div>`;
}

function renderFridge(){
  const shelves = (data.shelves && data.shelves.length) ? data.shelves : [8,8,8,8];
  const placed = new Map(), loose = [];
  data.bottles.forEach(b => {
    const s = parseInt(b.shelf), sl = parseInt(b.slot), key = s + ':' + sl;
    if (s >= 1 && s <= shelves.length && sl >= 1 && sl <= shelves[s-1] && !placed.has(key)) placed.set(key, b);
    else loose.push(b);
  });
  let h = '';
  shelves.forEach((n, i) => {
    const cells = []; for (let j = 1; j <= n; j++) cells.push(placed.get((i+1) + ':' + j) || null);
    h += shelfHtml(i + 1, n, cells, i < 2);
  });
  if (loose.length) {
    const n = Math.max(3, Math.min(5, ...shelves));
    for (let i = 0; i < loose.length; i += n) h += shelfHtml('', n, loose.slice(i, i + n).concat(Array(Math.max(0, n - loose.slice(i, i + n).length)).fill(null)));
  }
  const cans = visibleCans();
  if (cans.length) {
    h += `<div class="floor"><div class="floor-label">Cans</div><div class="cans">${cans.map(c => {
      const q = Number(c.qty) || 1;
      return `<button class="can-item${filter === 'all' ? '' : ' dim'}" data-kind="can" data-id="${esc(c.id)}" aria-label="${esc(`${c.brewer||''} ${c.name}, ${q} left`)}">
        <span class="can-pic">${pic(c, 'can', 300)}${q > 1 ? `<span class="qty">×${q}</span>` : ''}</span>
        <span class="can-name">${esc(c.name)}</span></button>`;
    }).join('')}</div></div>`;
  }
  $('#interior').innerHTML = h;
}

function renderList(){
  let h = '';
  ORDER.forEach(k => {
    const items = data.bottles.filter(b => typeKey(b.type) === k && matches(b))
      .sort((a,b) => bottleTitle(a).localeCompare(bottleTitle(b)) || String(a.vintage).localeCompare(String(b.vintage)));
    if (!items.length) return;
    h += `<div class="group"><h3><span class="d" style="--c:${TYPES[k].c}"></span>${TYPES[k].label} <small>${items.length}</small></h3><ul class="items">`;
    items.forEach(b => {
      const st = status(b);
      const sub = [b.vintage, b.region || b.country, b.grape].filter(Boolean).join(' · ');
      const loc = st?.soon ? `<span class="loc soon">${esc(st.label)}</span>` : `<span class="loc">${b.shelf ? 'Shelf ' + esc(b.shelf) : ''}</span>`;
      h += `<li><button class="item" data-kind="bottle" data-id="${esc(b.id)}"><span class="thumb">${pic(b, 'bottle', 160)}</span>
        <span class="txt"><span class="t1">${esc(bottleTitle(b))}</span><span class="t2">${esc(sub)}</span></span>${loc}</button></li>`;
    });
    h += '</ul></div>';
  });
  const cans = visibleCans();
  if (cans.length && filter === 'all') {
    h += `<div class="group"><h3>Cans <small>${cans.length}</small></h3><ul class="items">${cans.map(c => `
      <li><button class="item" data-kind="can" data-id="${esc(c.id)}"><span class="thumb">${pic(c, 'can', 160)}</span>
      <span class="txt"><span class="t1">${esc([c.brewer && !String(c.name).includes(c.brewer) ? c.brewer : '', c.name].filter(Boolean).join(' '))}</span><span class="t2">${esc([c.style, c.abv ? fmtPct(c.abv) : ''].filter(Boolean).join(' · '))}</span></span>
      <span class="loc">×${esc(c.qty ?? 1)}</span></button></li>`).join('')}</ul></div>`;
  }
  $('#listView').innerHTML = h || '<p class="empty-msg">Nothing here.</p>';
}

function renderUpdated(){
  if (!updatedAt) { $('#updated').textContent = ''; return; }
  const mins = Math.round((Date.now() - updatedAt) / 60000);
  $('#updated').textContent = isDemo ? 'Sample data' : mins < 1 ? 'Updated just now' : mins < 60 ? `Updated ${mins} min ago` : `Updated ${new Date(updatedAt).toLocaleString([], {dateStyle:'short',timeStyle:'short'})}`;
}

/* ===== Detail sheet ===== */
const fact = (label, val, cls) => val ? `<div${cls ? ` class="${cls}"` : ''}><dt>${label}</dt><dd>${val}</dd></div>` : '';

function openDetail(kind, id){
  const list = kind === 'can' ? data.cans : data.bottles;
  const it = list.find(x => String(x.id) === String(id));
  if (!it) return;
  let h = `<button class="close" aria-label="Close" data-close>×</button><div class="hero">${pic(it, kind, 1000, true)}</div><div class="sheet">`;
  let lookup;
  if (kind === 'bottle') {
    const T = TYPES[typeKey(it.type)], st = status(it);
    const win = (it.drink_from || it.drink_to) ? `${esc(it.drink_from || '…')}–${esc(it.drink_to || '…')}` : '';
    h += `<div class="sh-head"><span class="pill" style="--c:${T.c}">${esc(it.type || T.label)}</span>${st ? `<span class="badge ${st.k}">${esc(st.label)}</span>` : ''}</div>
      <h2 id="sheetTitle">${esc(sameName(it) ? it.producer : (it.name || it.producer))}</h2>
      <p class="producer">${esc([it.name && !sameName(it) ? it.producer : '', it.vintage].filter(Boolean).join(' · '))}</p>
      ${it.tasting_notes ? `<p class="tasting">${esc(it.tasting_notes)}</p>` : ''}
      <dl class="facts">
        ${fact('Where', it.shelf ? `Shelf ${esc(it.shelf)}${it.slot ? ', slot ' + esc(it.slot) : ''}` : '')}
        ${fact('Region', esc([it.region, it.country].filter(Boolean).join(', ')))}
        ${fact(typeKey(it.type) === 'spirit' || typeKey(it.type) === 'liqueur' ? 'Made with' : 'Grape', esc(it.grape))}
        ${fact('Drinking window', win)}
        ${fact('ABV', it.abv ? fmtPct(it.abv) : '')}
        ${fact('Size', esc(it.size))}
        ${fact('Goes with', esc(it.pairing), 'wide')}
        ${fact('Rating', stars(it.rating))}
        ${owner ? fact('Paid', it.price != null ? fmtMoney(it.price) : '', 'private') + fact('Bought', esc(it.bought), 'private') : ''}
      </dl>`;
    lookup = 'https://www.vivino.com/search/wines?q=' + encodeURIComponent([it.producer, it.name, it.vintage].filter(Boolean).join(' '));
  } else {
    h += `<div class="sh-head"><span class="pill" style="--c:${hex(it.colour)}">${esc(it.style || 'Can')}</span><span class="badge">${esc(it.qty ?? 1)} left</span></div>
      <h2 id="sheetTitle">${esc(it.name)}</h2>
      <p class="producer">${esc(it.brewer)}</p>
      ${it.tasting_notes ? `<p class="tasting">${esc(it.tasting_notes)}</p>` : ''}
      <dl class="facts">
        ${fact('Where', 'Bottom of the fridge')}
        ${fact('ABV', it.abv ? fmtPct(it.abv) : '')}
        ${fact('Size', esc(it.size))}
        ${fact('Style', esc(it.style))}
      </dl>`;
    lookup = 'https://www.google.com/search?q=' + encodeURIComponent([it.brewer, it.name].filter(Boolean).join(' '));
  }
  if (it.notes) h += `<p class="notes"><small>Our notes</small>${esc(it.notes)}</p>`;
  if (it.tasting_notes || it.source) h += `<p class="fine">Some details were looked up automatically and may be approximate.</p>`;
  const more = safeUrl(it.link) || safeUrl(it.source);
  h += `<div class="actions"><a class="btn" href="${esc(more || lookup)}" target="_blank" rel="noopener">${more ? 'More info' : 'Look it up'} ↗</a>
    ${owner ? `<button class="btn primary" data-drink="${kind}" data-id="${esc(it.id)}">${kind === 'can' ? 'Had one' : 'Drank this one'}</button>` : ''}</div></div>`;
  $('#sheetBody').innerHTML = h;
  $('#sheet').showModal();
}

/* ===== Data loading ===== */
async function api(body){
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Request failed');
  return j;
}

async function load(quiet){
  if (isDemo) {
    data = data || structuredClone(SAMPLE);
    owner = pin() === DEMO_PIN; updatedAt = Date.now(); render(); return;
  }
  try {
    let d;
    if (pin()) {
      try { d = (await api({action:'data', pin:pin()})).data; owner = true; }
      catch (e) { if (/PIN/i.test(e.message)) { store.del(PIN_KEY); owner = false; } else throw e; }
    }
    if (!d) { const r = await fetch(API_URL + '?t=' + Date.now()); d = await r.json(); owner = false; }
    data = d; updatedAt = Date.now();
    store.set(CACHE_KEY, {data:d, at:updatedAt});
    render();
    if (!quiet) toast('Up to date');
  } catch (e) {
    if (!data) $('#summary').textContent = 'Couldn’t load the fridge. Check your connection.';
    else toast('Couldn’t refresh, showing saved list');
  }
}

async function drink(kind, id, btn){
  if (!btn.classList.contains('confirm')) {
    btn.classList.add('confirm'); btn.textContent = 'Tap again to confirm';
    setTimeout(() => { if (btn.isConnected && !btn.disabled) { btn.classList.remove('confirm'); btn.textContent = kind === 'can' ? 'Had one' : 'Drank this one'; } }, 4000);
    return;
  }
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    let msg;
    if (isDemo) {
      if (kind === 'can') { const c = data.cans.find(x => x.id === id); c.qty = Math.max(0, (Number(c.qty)||1) - 1); msg = c.qty + ' left'; }
      else { data.bottles = data.bottles.filter(x => x.id !== id); msg = 'Removed from the fridge'; }
    } else {
      const r = await api({action:'drink', pin:pin(), kind, id});
      data = r.data; msg = r.message; updatedAt = Date.now(); store.set(CACHE_KEY, {data, at:updatedAt});
    }
    $('#sheet').close(); render(); toast('Cheers! ' + msg);
  } catch (e) {
    btn.disabled = false; btn.classList.remove('confirm'); btn.textContent = 'Try again';
    toast(e.message);
  }
}

async function toggleOwner(){
  if (owner) {
    if (confirm('Lock owner mode on this phone?')) { store.del(PIN_KEY); owner = false; await load(true); render(); toast('Locked'); }
    return;
  }
  const p = (prompt('Owner PIN') || '').trim();
  if (!p) return;
  if (isDemo) {
    if (p !== DEMO_PIN) return toast('Wrong PIN');
    store.set(PIN_KEY, p); owner = true; render(); return toast('Owner mode on');
  }
  try {
    const r = await api({action:'data', pin:p});
    store.set(PIN_KEY, p); owner = true; data = r.data; updatedAt = Date.now();
    store.set(CACHE_KEY, {data, at:updatedAt}); render(); toast('Owner mode on');
  } catch (e) { toast(/PIN/i.test(e.message) ? 'Wrong PIN' : 'Couldn’t check PIN'); }
}

/* ===== Events ===== */
function setView(v){
  view = v; store.set('wineFridge:view', view);
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === view));
  $('#fridgeView').hidden = view !== 'fridge'; $('#listView').hidden = view !== 'list';
}
document.addEventListener('click', e => {
  const chip = e.target.closest('[data-f]');
  if (chip) { filter = chip.dataset.f === filter ? 'all' : chip.dataset.f; render(); return; }
  const v = e.target.closest('[data-view]');
  if (v) { setView(v.dataset.view); return; }
  const d = e.target.closest('[data-drink]');
  if (d) { drink(d.dataset.drink, d.dataset.id, d); return; }
  if (e.target.closest('[data-close]')) { $('#sheet').close(); return; }
  const it = e.target.closest('[data-kind][data-id]');
  if (it) openDetail(it.dataset.kind, it.dataset.id);
});
$('#sheet').addEventListener('click', e => { if (e.target === $('#sheet')) $('#sheet').close(); });
$('#refresh').addEventListener('click', () => load(false));
$('#ownerBtn').addEventListener('click', toggleOwner);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
setInterval(renderUpdated, 30000);

/* Shared glass highlight for drawn bottles and cans */
document.body.insertAdjacentHTML('beforeend', `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".25"/><stop offset=".28" stop-color="#fff" stop-opacity=".32"/>
  <stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient></defs></svg>`);

/* ===== Boot: show saved copy instantly, then refresh ===== */
(function boot(){
  $('#demoNote').hidden = !isDemo;
  if (store.get('wineFridge:view') === 'list') setView('list');
  if (!isDemo) {
    const c = store.get(CACHE_KEY);
    if (c && c.data) { data = c.data; owner = !!(c.data.owner && pin()); updatedAt = c.at; render(); }
  }
  load(true);
})();
</script>
</body>
